name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: users-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npx jest

  llint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: users-service

    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx eslint .

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: docker build -t users-service ./users-service